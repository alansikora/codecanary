name: 'CodeCanary PR Review'
description: 'AI-powered code review for GitHub pull requests'
branding:
  icon: 'eye'
  color: 'yellow'

inputs:
  provider_secret:
    description: 'Provider API key or OAuth token (set as CODECANARY_PROVIDER_SECRET repo secret)'
    required: false
  config_path:
    description: 'Path to .codecanary/config.yml'
    required: false
    default: '.codecanary/config.yml'
  post_comment:
    description: 'Post findings as PR comment'
    required: false
    default: 'true'
  codecanary_version:
    description: 'CodeCanary CLI version to install (e.g. "v0.1.0"). Defaults to latest release.'
    required: false
    default: 'latest'
  reply_only:
    description: 'Evaluate thread replies only, skip new findings'
    required: false
    default: 'false'
  mode:
    description: '"review" reviews the PR; "fix" applies or refutes the open findings and pushes the fix (`codecanary fix`; needs fix.enabled in the config)'
    required: false
    default: 'review'

outputs:
  findings:
    description: 'Findings the review left open (review mode)'
    value: ${{ steps.run-review.outputs.findings }}
  fix:
    description: '"true" when the config enables the CI fix (review mode)'
    value: ${{ steps.run-review.outputs.fix }}

runs:
  using: 'composite'
  steps:
    - name: Install CodeCanary
      shell: bash
      env:
        CODECANARY_VERSION: ${{ inputs.codecanary_version }}
        CODECANARY_GITHUB_TOKEN: ${{ github.token }}
      run: |
        ARGS=()
        if [ "$CODECANARY_VERSION" != "latest" ]; then
          ARGS+=(--version "$CODECANARY_VERSION")
        fi
        curl -fsSL https://raw.githubusercontent.com/alansikora/codecanary/main/install.sh | sh -s -- "${ARGS[@]}"
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    # The fix runs fix.provider (default: provider), which may be another
    # CLI than the review's; codecanary resolves it.
    - name: Detect provider
      id: detect-provider
      shell: bash
      env:
        CONFIG: ${{ inputs.config_path }}
        MODE: ${{ inputs.mode }}
      run: |
        if [ "$MODE" = "fix" ]; then
          PROVIDER=$(codecanary fix --print-provider --config "$CONFIG" 2>/dev/null || true)
        elif [ -f "$CONFIG" ]; then
          PROVIDER=$(grep -E '^provider:' "$CONFIG" | awk '{print $2}')
        fi
        echo "provider=${PROVIDER:-anthropic}" >> $GITHUB_OUTPUT

    - name: Install Claude Code
      if: steps.detect-provider.outputs.provider == 'claude'
      shell: bash
      run: |
        curl -fsSL https://claude.ai/install.sh | bash > /dev/null 2>&1
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        claude --version

    - name: Install Codex
      if: steps.detect-provider.outputs.provider == 'codex'
      shell: bash
      run: |
        curl -fsSL https://chatgpt.com/codex/install.sh | sh > /dev/null 2>&1
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        "$HOME/.local/bin/codex" --version

    # fix.format_command runs only inside bubblewrap (`codecanary fix`), and
    # the codex fix runs its commands in it: without it the codex fix
    # refuses to start.
    - name: Install bubblewrap
      if: inputs.mode == 'fix' && runner.os == 'Linux'
      shell: bash
      run: |
        "${{ github.action_path }}/scripts/setup-bwrap.sh" \
          || echo "::warning::the bubblewrap sandbox is unavailable; fix.format_command will be skipped and a codex fix will not run"

    - name: Generate review token
      id: review-token
      shell: bash
      # A review (and a reply_only run) gets a token with contents: read, so
      # the model reviewing an untrusted diff never holds one that can push;
      # the step fails if the token service grants more. The fix gets the
      # app's full permissions, since it pushes.
      env:
        MODE: ${{ inputs.mode }}
      run: |
        "${{ github.action_path }}/scripts/app-token.sh"

    - name: Fetch PR history
      if: inputs.mode != 'fix'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      # Best-effort: deepening by the PR commit count makes the previous review
      # SHA available for incremental diffs in the common case (new commits pushed).
      # After force-pushes or rebases, `codecanary review` fetches the old SHA and
      # the base branch itself (see fetchIncrementalHistory in Go).
      run: |
        if [ -n "$PR_NUMBER" ]; then
          COMMITS=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.commits')
          if [ -n "$COMMITS" ] && [ "$COMMITS" -gt 0 ] 2>/dev/null; then
            if ! err=$(git fetch --deepen="$COMMITS" origin 2>&1); then
              echo "::warning::git fetch --deepen failed: $err"
            fi
          fi
        fi

    - name: Run review
      id: run-review
      if: inputs.mode != 'fix'
      shell: bash
      env:
        CODECANARY_PROVIDER_SECRET: ${{ inputs.provider_secret }}
        GH_TOKEN: ${{ steps.review-token.outputs.token }}
      run: |
        PR_NUMBER="${{ github.event.pull_request.number }}"
        REPO="${{ github.repository }}"
        POST_FLAG=""
        if [ "${{ inputs.post_comment }}" = "true" ]; then
          POST_FLAG="--post"
        fi
        REPLY_ONLY_FLAG=""
        if [ "${{ inputs.reply_only }}" = "true" ]; then
          REPLY_ONLY_FLAG="--reply-only"
        fi
        codecanary review "$PR_NUMBER" \
          --repo "$REPO" \
          --config "${{ inputs.config_path }}" \
          $POST_FLAG \
          $REPLY_ONLY_FLAG

    # GitHub lets only a token with contents: write resolve a review thread,
    # and the review's token has contents: read. The review therefore reports
    # the threads it settled (`resolve_threads`), and they are resolved here,
    # after the model has finished, with a token minted for this step alone.
    # `codecanary resolve` takes nothing from the review but the thread IDs
    # and resolves only CodeCanary finding threads on this PR. It fails the
    # job when a thread stays open, so the PR never shows a finding as
    # resolved while its thread still blocks the merge.
    - name: Generate resolve token
      id: resolve-token
      if: inputs.mode != 'fix' && steps.run-review.outputs.resolve_threads != ''
      shell: bash
      env:
        MODE: resolve
      run: |
        "${{ github.action_path }}/scripts/app-token.sh"

    - name: Resolve threads
      if: inputs.mode != 'fix' && steps.run-review.outputs.resolve_threads != ''
      shell: bash
      env:
        GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        THREADS: ${{ steps.run-review.outputs.resolve_threads }}
      run: |
        codecanary resolve "$PR_NUMBER" --repo "$REPO" --threads "$THREADS"

    - name: Run fix
      if: inputs.mode == 'fix'
      shell: bash
      env:
        CODECANARY_PROVIDER_SECRET: ${{ inputs.provider_secret }}
        GH_TOKEN: ${{ steps.review-token.outputs.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        CONFIG_PATH: ${{ inputs.config_path }}
        REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        codecanary fix "$PR_NUMBER" \
          --repo "$REPO" \
          --config "$CONFIG_PATH" \
          --reviewed-sha "$REVIEWED_SHA"
