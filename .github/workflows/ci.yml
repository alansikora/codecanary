name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Build
        run: go build ./cmd/review

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Vet
        run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      # The fix's format sandbox; its test fails rather than skips here, so
      # this runner image proves bubblewrap works on it.
      - name: Install bubblewrap
        run: scripts/setup-bwrap.sh

      - name: Test
        env:
          CODECANARY_REQUIRE_BWRAP: "1"
        run: go test -race -count=1 ./...

      # The action's app-token exchange, against a fake token service.
      - name: Test app token script
        run: scripts/app-token.test.sh

  oidc-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oidc/worker
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: oidc/worker/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test
