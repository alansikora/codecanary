# TEMPORARY (drop before merge): which GITHUB_TOKEN permissions let an
# installation token call resolveReviewThread? Each job tries one probe thread
# on this PR and prints the outcome; no job fails on a refusal.
name: Resolve probe
on:
  pull_request:
permissions: {}
jobs:
  pr-write-contents-read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          THREAD: PRRT_kwDORvs_0M66qI3D
        run: &probe |
          set +e
          out=$(gh api graphql -f query='mutation($t:ID!){resolveReviewThread(input:{threadId:$t}){thread{isResolved}}}' -f t="$THREAD" 2>&1)
          echo "exit=$? output=$out"
  pr-write-contents-write:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          THREAD: PRRT_kwDORvs_0M66qI3V
        run: *probe
  contents-write-only:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          THREAD: PRRT_kwDORvs_0M66qI4D
        run: *probe
