# TEMPORARY — proves the review-mode app token on this PR; delete before merge.
# Runs this branch's own action (uses: ./), which pull_request_target can't.
name: Review token proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/review-token-proof.yml
      - action.yml
      - scripts/app-token.sh

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # 1. A real review with the reduced token: posts its comments and the
      #    CodeCanary / review status. The action's token step fails if the
      #    token it got can write contents.
      - uses: ./
        with:
          provider_secret: ${{ secrets.CODECANARY_PROVIDER_SECRET }}
          config_path: .codecanary/config.yml
          codecanary_version: canary

      # 2. A review-mode token from the same script tries to write.
      - name: Writes with a review token are refused
        env:
          MODE: review
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          out=$(mktemp)
          GITHUB_OUTPUT="$out" scripts/app-token.sh
          TOKEN=$(sed -n 's/^token=//p' "$out")
          failed=0

          echo "--- read: GET pulls/$PR (expect 200)"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/$REPO/pulls/$PR")
          echo "HTTP $code"; [ "$code" = 200 ] || failed=1

          echo "--- write: PUT contents/review-token-proof.txt (expect 403)"
          code=$(curl -sS -o resp.json -w '%{http_code}' -X PUT -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/contents/review-token-proof.txt" \
            -d "{\"message\":\"proof\",\"content\":\"$(printf proof | base64)\",\"branch\":\"${GITHUB_HEAD_REF}\"}")
          echo "HTTP $code: $(jq -r '.message // empty' resp.json)"
          [ "$code" = 403 ] || failed=1

          echo "--- write: git push to refs/heads/review-token-proof-$GITHUB_RUN_ID (expect 403)"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          if push=$(git -c "http.extraheader=AUTHORIZATION: basic $auth" \
              push "https://github.com/$REPO.git" "HEAD:refs/heads/review-token-proof-$GITHUB_RUN_ID" 2>&1); then
            echo "$push"; echo "::error::git push with a review token succeeded"; failed=1
          else
            echo "$push"
            grep -q '403' <<<"$push" || { echo "::error::push failed, but not with 403"; failed=1; }
          fi

          exit $failed
